[workspace]
resolver = "2"
members = [
    "crates/mathesis-ast",
    "crates/mathesis-graph",
    "crates/mathesis-lean-parse",
    "crates/mathesis-importer",
    "crates/mathesis-annotate",
    "crates/mathesis-wasm",
    "crates/mathesis-msc",
    "crates/mathesis-ingest",
    "crates/mathesis-taxonomy",
    "crates/mathesis-fulltext",
    "crates/mathesis-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
debug = 1  # debugSymbols for flamegraph

[profile.bench]
inherits = "release"
