[package]
name = "mathesis-fulltext"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mathesis-fulltext"
path = "src/main.rs"

[dependencies]
mathesis-ingest = { path = "../mathesis-ingest" }
mathesis-ast = { path = "../mathesis-ast" }
mathesis-graph = { path = "../mathesis-graph" }
ureq = { version = "2", features = ["tls"] }
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
anyhow = "1"
