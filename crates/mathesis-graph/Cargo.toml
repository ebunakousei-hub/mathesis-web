[package]
name = "mathesis-graph"
version.workspace = true
edition.workspace = true

[dependencies]
mathesis-ast = { path = "../mathesis-ast" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "main"
harness = false
