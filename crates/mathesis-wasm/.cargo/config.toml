# ブラウザへ配信するwasm成果物にビルドマシンの絶対パス（Windowsユーザー名を
# 含む）が埋め込まれるのを防ぐ。ワークスペース共通のCargo.tomlは
# `debug = 1`（flamegraph用）としているため`strip`では消えず、
# `file!()`由来のパニック位置文字列（std/依存クレートのソースパス）に
# 実際のホームディレクトリが平文で残っていた（2026-09-05、Web公開前の
# 監査で発見）。このcrate配下でのビルドにだけ絶対パスの置換を適用する
# （ワークスペース全体のプロファイルは変更しない——CLIバイナリの
# flamegraph用途には影響を与えないため）。TOMLの literal string（単一
# クォート）を使い、バックスラッシュのエスケープ問題を避ける。
[build]
rustflags = ["--remap-path-prefix", 'C:\Users\feruy=~']
